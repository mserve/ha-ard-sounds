# https://www.home-assistant.io/integrations/default_config/
default_config:

# https://www.home-assistant.io/integrations/homeassistant/
homeassistant:
  debug: true
  auth_providers:
    - type: trusted_networks
      allow_bypass_login : true
      trusted_networks:
        - 192.168.0.0/24
        - 172.16.0.0/12
        - 10.0.0.0/8
        - 127.0.0.1
        - ::1
    - type: homeassistant

# https://www.home-assistant.io/integrations/logger/
logger:
  default: info
  logs:
    custom_components.ard_sounds: debug

media_player:
  - platform: universal
    name: DEV_MEDIA_PLAYER
    state_template: "on"
    device_class: speaker
    unique_id: dev_media_player
    commands:
      turn_on:
        action: scene.reload
        data: {}
      turn_off:
        action: scene.reload
        data: {}
      play_media:
        action: scene.reload
        data: {}